# Values for the actions-runner-controller runner scale set chart.
# Install ARC itself and create the GitHub credential secret separately.
githubConfigUrl: https://github.com/Softala-MLOPS-Rauli/workRauli
githubConfigSecret: arc-github-secret
runnerScaleSetName: arc-mlops
runnerGroup: default
minRunners: 0
maxRunners: 2

template:
  spec:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL